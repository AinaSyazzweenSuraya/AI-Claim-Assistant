[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-claims-assistant"
version = "0.1.0"
description = "A standalone policy-grounded allowance draft assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "certifi>=2025.1", "tzdata>=2025.1", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]
florence = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=5.4,<6"]

[project.scripts]
claims = "claims_assistant.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_assistant"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
